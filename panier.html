  .products, .cart {

  .product:last-child, .cart-item:last-child {

  .add-btn, .remove-btn, .order-btn {

    border-radius: 8px;

  }
  
  .remove-btn:hover {
    background-color: #b63c3c;
  }
  
  .order-btn {
    width: 100%;
    margin-top: 20px;
    background-color: #6f4e37;
    color: white;
    font-size: 18px;
  }
  
  .order-btn:hover {
    background-color: #563c2c;
  }
  
  .cart-total {

    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;

  }
  
  @media screen and (max-width: 600px) {
    .product, .cart-item {

      align-items: flex-start;
    }
  
    .add-btn, .remove-btn {

      width: 100%;

</style>

  <div class="products">
    <h2>Produits disponibles</h2>
 
    <div class="product">
      <span>Hot Chocolate - 7DT</span>
      <button class="add-btn" onclick="addToCart('Hot Chocolate', 7)">Ajouter</button>
    </div>
    <div class="product">
      <span>Smoothie Banane Kiwi - 10.500DT</span>
      <button class="add-btn" onclick="addToCart('Smoothie Banane Kiwi', 10.500)">Ajouter</button>
    </div>
    <div class="product">
      <span> Frappuccino Nutella _ 10.500DT</span>
      <button class="add-btn" onclick="addToCart('Frappuccino Nutella', 10.500)">Ajouter</button>
    </div>
  </div>

  <div class="cart">
    <h2>Votre panier</h2>
    <div id="cart-items"></div>
    <div class="cart-total" id="cart-total">Total : 0.00DT</div>
    <button class="order-btn" onclick="checkout()">Commander</button>
  </div>


  <script>
    let cart = [];
window.onload = function () {
const storedCart = localStorage.getItem("myCart");
if (storedCart) {
    cart = JSON.parse(storedCart);
      updateCart();
      }
    };
function addToCart(name, price) {
      cart.push({ name, price });
      saveCart();
      updateCart();
    }
function removeFromCart(index) {
  cart.splice(index, 1);
  saveCart();
    updateCart();
    }
function saveCart() {
    localStorage.setItem("myCart", JSON.stringify(cart));
    }
function updateCart() {
      const cartItems = document.getElementById("cart-items");
      const cartTotal = document.getElementById("cart-total");
      cartItems.innerHTML = "";
let total = 0;
      cart.forEach((item, index) => {
        total += item.price;
        cartItems.innerHTML += `
          <div class="cart-item">
            <span>${item.name} - ${item.price.toFixed(2)}DT</span>
            <button class="remove-btn" onclick="removeFromCart(${index})">Supprimer</button>
          </div>
        `;
      });
cartTotal.textContent = "Total : " + total.toFixed(2) + "DT";
    }
  </script>
